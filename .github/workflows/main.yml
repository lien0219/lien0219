name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      # 1. 创建发布目录
      - name: Create dist directory
        run: mkdir -p dist

      # 2. 生成 3D 贡献图 (WebGL 风格)
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: lien0219

      # 3. 生成 静态 Metrics 指标图 (替代不稳定的 Vercel 卡片)
      - name: Generate Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          output_action: none

      # 4. 汇总所有图片到 dist 目录
      - name: Move visuals to dist
        run: |
          # 移动 3D 图
          if [ -d "profile-3d-contrib" ]; then
            cp -r profile-3d-contrib dist/
            echo "3D contrib copied."
          fi
          # 移动 Metrics 图 (metrics 默认生成在根目录)
          if [ -f "metrics.svg" ]; then
            mv metrics.svg dist/
            echo "Metrics SVG moved."
          fi

      # 5. 推送发布到 output 分支
      - name: Push to output
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
