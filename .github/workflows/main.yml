name: Generate Minimal Neon Snake

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: lien0219
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#BF00FF&color_dots=#FFB6C1,#9BE9A8,#40C463,#30A14E,#216E39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#BF00FF&color_dots=#FFB6C1,#9BE9A8,#40C463,#30A14E,#216E39

      - name: Push to output
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
