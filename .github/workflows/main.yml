name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      # 1. 创建发布目录
      - name: Create dist directory
        run: mkdir -p dist

      # 2. 生成 3D 贡献图
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: lien0219

      # 3. 生成 贪吃蛇
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: lien0219
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#BF00FF&color_dots=#FFB6C1,#9BE9A8,#40C463,#30A14E,#216E39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 健壮的发布逻辑
      - name: Move visuals to dist
        run: |
          if [ -d "profile-3d-contrib" ]; then
            cp -r profile-3d-contrib dist/
            echo "3D contrib copied successfully."
          else
            echo "Warning: profile-3d-contrib directory not found."
          fi

      # 5. 推送发布
      - name: Push to output
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
