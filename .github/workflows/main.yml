name: Generate Profile Visuals

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      # 1. 生成 3D 贡献图 (默认在根目录生成 profile-3d-contrib 文件夹)
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: lien0219

      # 2. 生成 贪吃蛇 (在 dist 目录)
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: lien0219
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#BF00FF&color_dots=#FFB6C1,#9BE9A8,#40C463,#30A14E,#216E39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 关键：将 3D 图移动到 dist 文件夹，以便统一发布
      - name: Move 3D graph to dist
        run: |
          mkdir -p dist
          cp -r profile-3d-contrib dist/

      # 4. 推送 dist 文件夹到 output 分支
      - name: Push to output
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
